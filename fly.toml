# fly.io: "fly launch --copy-config --no-deploy" übernimmt diese Datei (App-Namen bei Bedarf ändern)
app = "parawerk"
primary_region = "fra"

[build]

# Verbrauchs-Datenbank (Kostendeckel) als SQLite auf einem Volume. Vorher einmal anlegen:
#   fly volumes create parawerk_daten --size 1 --region fra
# Ein Volume gehört zu genau einer Maschine, deshalb: fly scale count 1
[env]
  DATABASE_URL = "sqlite:////data/parawerk.db"

[mounts]
  source = "parawerk_daten"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/gesund"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
